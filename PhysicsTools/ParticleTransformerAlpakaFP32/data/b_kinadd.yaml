new_variables:
   part_mask: ak.ones_like(part_deta)
   part_pt: np.hypot(part_px, part_py)
   part_pt_log: np.log(part_pt)
   part_e_log: np.log(part_energy)
   part_logptrel: np.log(part_pt/jet_pt)
   part_logerel: np.log(part_energy/jet_energy)
   part_deltaR: np.hypot(part_deta, part_dphi)
   jet_isB: label
   jet_isnotB: 1-label
inputs:
   pf_points:
      length: 16
      pad_mode: wrap
      vars: [[part_deta, null], [part_dphi, null]]
   pf_features:
      length: 16
      pad_mode: wrap
      vars:
         - [part_pt_log, 1.7, 0.7]
         - [part_e_log, 2.0, 0.7]
         - [part_logptrel, -4.7, 0.7]
         - [part_logerel, -4.7, 0.7]
         - [part_deltaR, 0.2, 4.0]
         - [part_deta, null]
         - [part_dphi, null]
         - [part_z0, null]
         - [part_dxy, null]
         - [part_pweight, null]
         - [part_isChargedHadron, null]
         - [part_isNeutralHadron, null]
         - [part_isPhoton, null]
         - [part_isElectron, null]
         - [part_isMuon, null]
   pf_vectors:
      length: 16
      pad_mode: wrap
      vars: [[part_px, null], [part_py, null], [part_pz, null], [part_energy, null]]
   pf_mask:
      length: 16
      pad_mode: constant
      vars: [[part_mask, null]]
labels:
   type: simple
   value: [jet_isB, jet_isnotB]
observers: [jet_pt, jet_eta, jet_nparticles]
weights:
